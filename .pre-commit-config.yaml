# Einmalig: git init && uv run pre-commit install
# Alle Hooks nutzen die Tool-Versionen aus dem Projekt-venv (uv run).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (adbbot, strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
