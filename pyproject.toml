[project]
name = "adbbot-template"
version = "0.1.0"
description = "Template für ADB-basierte Android-Bots: Framework (adbbot) + Beispielprojekt (mybot)"
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.8",
    "av>=12",  # H.264-Dekoder für den scrcpy-Bildschirmstream
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "PySide6>=6.7",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pre-commit>=3.7"]

[project.scripts]
mybot = "mybot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adbbot", "src/mybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "TID"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # deutsche Texte (Anführungszeichen, Gedankenstriche)
    "N818",                        # Exception-Namen laut Architektur (StepFailed, BotStopped, ...)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "ctx.sleep() bzw. clock.sleep() verwenden (siehe ARCHITECTURE.md, Konventionen)"
"time.monotonic".msg = "clock.monotonic() verwenden (siehe ARCHITECTURE.md, Konventionen)"

[tool.ruff.lint.per-file-ignores]
"src/adbbot/core/clock.py" = ["TID251"]
"src/adbbot/gui/**" = ["N802"]  # Qt-Overrides wie wheelEvent/closeEvent
"src/*/pages/**" = ["RUF012"]  # Page.transitions ist per Basisklasse als ClassVar deklariert
"tests/**" = ["TID251"]
"tests/gui/**" = ["N802", "TID251"]

[tool.mypy]
python_version = "3.12"
files = ["src/adbbot"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["adbutils.*", "cv2.*", "rapidocr_onnxruntime.*", "pytesseract.*"]
ignore_missing_imports = true
